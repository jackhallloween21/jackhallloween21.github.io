<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Lounge | jackhallloween21</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="padding: 40px 0;">
    <div class="container">
        <div style="margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between;">
            <h1 class="gradient-text"><i class="fa-solid fa-headphones"></i> Music Lounge</h1>
            <a href="index.html" class="btn btn-glass"><i class="fa-solid fa-house"></i> Back to Portfolio</a>
        </div>

        <div class="media-grid">
            <div class="media-card">
                <h3 class="media-card-title"><i class="fa-brands fa-spotify"></i> Spotify Player</h3>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/5cF0dROlMOK5uNZtivgu50?utm_source=generator&theme=0" width="100%" height="150" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
                <div style="margin-top: 15px;">
                    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZEVXbMWDif5SCBJq?utm_source=generator&theme=0" width="100%" height="320" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
                </div>
            </div>

            <div class="media-card">
                <h3 class="media-card-title"><i class="fa-brands fa-youtube"></i> YouTube Playlist Mix</h3>
                <iframe width="100%" height="350" src="https://www.youtube.com/embed/9DyTU26FQlk?list=PLsDblIUMTkw3KPoe2ynbXhRqwmxQ7wSOe" title="YouTube playlist player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <div class="media-card">
                <h3 class="media-card-title"><i class="fa-brands fa-soundcloud"></i> SoundCloud</h3>
                <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/205680457&color=%2355d2bf&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
