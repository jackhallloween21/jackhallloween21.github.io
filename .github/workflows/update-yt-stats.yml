name: Update YouTube Stats

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  # Allows you to manually trigger the action from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch YouTube Channel Stats & Videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.API_KEY }}
          CHANNEL_ID: 'UC-5-P2ShRYIis_HItg8YsWw'
        run: |
          # 1. Fetch Channel Statistics and Uploads Playlist ID
          curl -s "https://www.googleapis.com/youtube/v3/channels?part=statistics,contentDetails&id=${CHANNEL_ID}&key=${YOUTUBE_API_KEY}" -o raw_channel.json
          
          # Extract Uploads Playlist ID (UC... -> UU...)
          UPLOADS_PLAYLIST_ID=$(node -e '
            const data = JSON.parse(require("fs").readFileSync("raw_channel.json"));
            if (data.items && data.items.length > 0) {
              console.log(data.items[0].contentDetails.relatedPlaylists.uploads);
            } else {
              process.exit(1);
            }
          ')

          # 2. Fetch Recent Uploaded Videos
          curl -s "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${UPLOADS_PLAYLIST_ID}&maxResults=6&key=${YOUTUBE_API_KEY}" -o raw_recent.json

          # 3. Fetch Top Videos (Ordered by View Count)
          curl -s "https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&order=viewCount&type=video&maxResults=6&key=${YOUTUBE_API_KEY}" -o raw_top.json

          # 4. Extract fields into yt-stats.json
          node -e '
            const fs = require("fs");
            const channelData = JSON.parse(fs.readFileSync("raw_channel.json"));
            const recentData = JSON.parse(fs.readFileSync("raw_recent.json"));
            const topData = JSON.parse(fs.readFileSync("raw_top.json"));

            if (channelData.items && channelData.items.length > 0) {
              const stats = channelData.items[0].statistics;
              
              // Extract Recent Videos
              const recentVideos = (recentData.items || []).map(item => ({
                videoId: item.snippet.resourceId.videoId,
                title: item.snippet.title,
                publishedAt: item.snippet.publishedAt,
                thumbnail: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
              }));

              // Extract Top/Popular Videos
              const topVideos = (topData.items || []).map(item => ({
                videoId: item.id.videoId,
                title: item.snippet.title,
                publishedAt: item.snippet.publishedAt,
                thumbnail: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
              }));

              const output = {
                subscriberCount: stats.subscriberCount,
                viewCount: stats.viewCount,
                videoCount: stats.videoCount,
                updatedAt: new Date().toISOString(),
                recentVideos: recentVideos,
                topVideos: topVideos
              };

              fs.writeFileSync("yt-stats.json", JSON.stringify(output, null, 2));
              console.log("Updated stats and videos successfully:", output);
            } else {
              console.error("Failed to fetch YouTube data", channelData);
              process.exit(1);
            }
          '
          rm raw_channel.json raw_recent.json raw_top.json

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add yt-stats.json
          if git diff --staged --quiet; then
            echo "No changes in YouTube stats."
          else
            git commit -m "chore: auto-update YouTube stats"
            git push
          fi
