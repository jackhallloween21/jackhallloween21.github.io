name: Update YouTube Stats

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  # Allows you to manually trigger the action from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch YouTube Channel Stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.API_KEY }}
          CHANNEL_ID: 'UC-5-P2ShRYIis_HItg8YsWw'
        run: |
          curl -s "https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${YOUTUBE_API_KEY}" -o raw_response.json
          
          # Extract relevant fields into a clean yt-stats.json file
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("raw_response.json"));
            if (data.items && data.items.length > 0) {
              const stats = data.items[0].statistics;
              const output = {
                subscriberCount: stats.subscriberCount,
                viewCount: stats.viewCount,
                videoCount: stats.videoCount,
                updatedAt: new Date().toISOString()
              };
              fs.writeFileSync("yt-stats.json", JSON.stringify(output, null, 2));
              console.log("Updated stats successfully:", output);
            } else {
              console.error("Failed to fetch stats or channel not found", data);
              process.exit(1);
            }
          '
          rm raw_response.json

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add yt-stats.json
          if git diff --staged --quiet; then
            echo "No changes in YouTube stats."
          else
            git commit -m "chore: auto-update YouTube stats"
            git push
          fi
